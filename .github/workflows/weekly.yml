name: Weekly refresh

on:
  schedule:
    # EIA publishes weekly retail prices on Monday afternoon US Eastern, so run after
    # 5 pm Eastern (22:00 UTC) and retry Tuesday morning for holiday or late releases.
    # The commit step does nothing when the data has not changed.
    - cron: "0 22 * * 1"
    - cron: "0 14 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      # The warehouse is not cached: each run rebuilds it from full EIA history.
      - name: Ingest EIA prices
        run: uv run python -m fuelpulse.ingest
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      # dbt source freshness is not used here: the warehouse is rebuilt on every run, so
      # loaded_at is always "now". This checks the newest EIA week and says why it fails.
      - name: Check EIA data freshness
        run: uv run python -m fuelpulse.freshness
      - name: dbt build (fails on any test failure)
        run: uv run dbt build --project-dir dbt --profiles-dir dbt
      - name: Forecast
        run: uv run python -m fuelpulse.forecast
      - name: Commit refreshed reports
        run: |
          git config user.name "fuelpulse-bot"
          git config user.email "fuelpulse-bot@users.noreply.github.com"
          git add reports/forecast.csv reports/history.parquet reports/run_log.json reports/run_log.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          week=$(python3 -c "import json; print(json.load(open('reports/run_log.json'))['latest_eia_week'])")
          git commit -m "chore(data): weekly forecast refresh for EIA week $week"
          git push
