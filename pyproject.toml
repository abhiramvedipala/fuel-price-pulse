[project]
name = "fuelpulse"
version = "0.1.0"
description = "Weekly US retail fuel price forecasting on EIA data"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "requests>=2.32",
    "xlrd>=2.0",
    "python-dotenv>=1.0",
    "dbt-duckdb>=1.9",
    "lightgbm>=4.5",
    "shap>=0.46",
    "matplotlib>=3.9",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.7"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fuelpulse"]
